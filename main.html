<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gordon Ramsay Fan Club</title>
    <style>
        :root {
            --bg: #faf7f2;
            --card: #ffffff;
            --ink: #1f1d1a;
            --muted: #6b665e;
            --accent: #c2410c;
            --border: #e7e1d8;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.5;
        }
        main {
            max-width: 640px;
            margin: 0 auto;
            padding: 48px 20px 64px;
        }
        .eyebrow {
            margin: 0;
            color: var(--accent);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        h1 {
            margin: 4px 0 24px;
            font-size: 2.25rem;
            line-height: 1.15;
        }
        .hero {
            width: 100%;
            border-radius: 12px;
            display: block;
        }
        .cats {
            display: inline-block;
            margin-top: 12px;
            color: var(--accent);
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-top: 32px;
        }
        h2 {
            margin: 0 0 12px;
            font-size: 1.25rem;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin: 12px 0 4px;
        }
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font: inherit;
            background: #fff;
        }
        textarea { min-height: 96px; resize: vertical; }
        input:focus, textarea:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }
        button {
            margin-top: 16px;
            padding: 10px 18px;
            border: 0;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { filter: brightness(1.08); }
        .error {
            color: #b91c1c;
            font-size: 0.875rem;
            margin: 8px 0 0;
            min-height: 1.3em;
        }
        #Reviews { margin-top: 16px; }
        .review {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            margin-top: 12px;
        }
        .review h3 { margin: 0 0 4px; font-size: 1.05rem; }
        .review p { margin: 0; color: var(--muted); white-space: pre-wrap; }
    </style>
</head>

<body>
    <main>
        <p class="eyebrow">Welcome to the</p>
        <h1>Gordon Ramsay Fan Club</h1>

        <img class="hero" src="https://cdn.realscreen.com/wp/wp-content/uploads/2017/08/Gordon-Ramsay.jpg" alt="Gordon Ramsay in chef's whites">
        <a class="cats" target="_blank" rel="noopener" href="https://www.google.com/search?q=cats&btnI=1">Do you like cats?</a>

        <section class="card">
            <h2>Leave a review</h2>
            <form id="ReviewForm">
                <label for="ReviewTitleArea">Title</label>
                <input id="ReviewTitleArea" maxlength="100" placeholder="e.g. Best chef ever">
                <label for="ReviewTextArea">Review</label>
                <textarea id="ReviewTextArea" maxlength="1000" placeholder="Enter your review here"></textarea>
                <p class="error" id="ReviewError" role="alert"></p>
                <button type="submit" id="ReviewSaveButton">Save review</button>
            </form>
        </section>

        <section>
            <div id="Reviews"></div>
        </section>
    </main>

    <script>
        function createReviewDiv(title, text) {
            var div = document.createElement("div");
            div.className = "review";
            var h3 = document.createElement("h3");
            h3.textContent = title;
            var p = document.createElement("p");
            p.textContent = text;
            div.append(h3, p);
            return div;
        }

        function addReview(event) {
            event.preventDefault();
            var title = ReviewTitleArea.value.trim();
            var text = ReviewTextArea.value.trim();
            if (!title || !text) {
                ReviewError.textContent = "Please add a title and a review.";
                return;
            }
            ReviewError.textContent = "";
            Reviews.prepend(createReviewDiv(title, text));
            ReviewForm.reset();
            ReviewTitleArea.focus();
        }

        ReviewForm.addEventListener("submit", addReview);
    </script>
</body>
</html>
